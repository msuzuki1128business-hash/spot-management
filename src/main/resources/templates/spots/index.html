<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
	<head>
	    <meta charset="UTF-8">
	    <title>スポット管理 - 空港スポット管理システム</title>

	    <link rel="stylesheet"
	          th:href="@{/css/spots.css}">
	</head>
<body>
    <header>
        <h1>空港スポット管理システム</h1>
        <form th:action="@{/logout}" method="post">
            <button type="submit">ログアウト</button>
        </form>
    </header>

    <main>
		<div class="toolbar">
		   <button th:data-date="${targetDate}" onclick="location.href='/spots/flights/new?date=' + this.dataset.date">+ 新規作成</button>
		    <button onclick="location.href='/spots?date=' + getPrevDate()" id="prevBtn">◀ 前日</button>
		    <span th:text="${targetDate}" style="font-weight:bold; font-size:14px;"></span>
		    <button onclick="location.href='/spots?date=' + getNextDate()" id="nextBtn">翌日 ▶</button>
		    <span class="utc-label">※ 時刻はすべてUTC表示</span>
		</div>

        <div class="schedule-wrapper">
            <!-- ヘッダー行 -->
            <div class="header-row">
				<div class="spot-header" style="display:flex; padding:0;">
					<div class="spot-col spot-col-number">スポット</div>
					<div class="spot-col spot-col-size">サイズ</div>
				</div>
                <div class="hours-header">
                    <div class="hour-label">00:00</div>
                    <div class="hour-label">01:00</div>
                    <div class="hour-label">02:00</div>
                    <div class="hour-label">03:00</div>
                    <div class="hour-label">04:00</div>
                    <div class="hour-label">05:00</div>
                    <div class="hour-label">06:00</div>
                    <div class="hour-label">07:00</div>
                    <div class="hour-label">08:00</div>
                    <div class="hour-label">09:00</div>
                    <div class="hour-label">10:00</div>
                    <div class="hour-label">11:00</div>
                    <div class="hour-label">12:00</div>
                    <div class="hour-label">13:00</div>
                    <div class="hour-label">14:00</div>
                    <div class="hour-label">15:00</div>
                    <div class="hour-label">16:00</div>
                    <div class="hour-label">17:00</div>
                    <div class="hour-label">18:00</div>
                    <div class="hour-label">19:00</div>
                    <div class="hour-label">20:00</div>
                    <div class="hour-label">21:00</div>
                    <div class="hour-label">22:00</div>
                    <div class="hour-label">23:00</div>
                </div>
            </div>

            <!-- スポット行 -->
            <div th:each="spot : ${spots}" class="spot-row" th:data-spot-id="${spot.id}">
				<div class="spot-label" style="display:flex; padding:0;">
					<div class="spot-number"
					     th:text="${spot.spotNumber}">
					</div>
					<div class="spot-size"
					     th:text="${spot.maxWingspan}">
					</div>
				</div>
				<div class="cells-area">
				    <th:block th:each="hour : ${#numbers.sequence(0,23)}">
				        <div class="quarter h"></div>
				        <div class="quarter"></div>
				        <div class="quarter"></div>
				        <div class="quarter"></div>
				    </th:block>
				</div>
            </div>
        </div>
    </main>

	<script　th:inline="javascript">
	const targetDate = /*[[${targetDate}]]*/ '';
	const flightsData = /*[[${flights}]]*/ [];
	</script>
	
	<script th:src="@{/js/spots.js}"></script>
</body>
</html>
