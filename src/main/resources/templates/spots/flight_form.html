<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>便登録 - 空港スポット管理システム</title>
    <style>
        body { font-family: Arial, sans-serif; margin: 0; padding: 0; }
        header { background-color: #2c3e50; color: white; padding: 10px 20px; display: flex; justify-content: space-between; align-items: center; }
        header h1 { margin: 0; font-size: 18px; }
        header button { background-color: #e74c3c; color: white; border: none; padding: 8px 16px; cursor: pointer; border-radius: 4px; }
        main { padding: 30px; max-width: 900px; }
        h2 { margin-bottom: 20px; }
        .form-group { margin-bottom: 16px; }
        .form-group label { display: block; margin-bottom: 4px; font-weight: bold; font-size: 13px; }
        .form-group input, .form-group select { width: 100%; padding: 8px; border: 1px solid #ccc; border-radius: 4px; font-size: 14px; box-sizing: border-box; }
        .required { color: #e74c3c; margin-left: 4px; }
        .flight-columns { display: grid; grid-template-columns: 1fr 1fr; gap: 24px; margin-top: 16px; }
        .flight-column { border: 1px solid #ddd; border-radius: 6px; padding: 16px; }
        .section-title { font-size: 14px; font-weight: bold; color: white; background-color: #2c3e50; padding: 6px 12px; border-radius: 4px; margin-bottom: 12px; text-align: center; }
        .optional { font-size: 11px; color: #95a5a6; margin-left: 4px; }
        .btn-group { display: flex; gap: 10px; margin-top: 24px; }
        .btn-primary { background-color: #2980b9; color: white; border: none; padding: 10px 24px; cursor: pointer; border-radius: 4px; font-size: 14px; }
        .btn-secondary { background-color: #95a5a6; color: white; border: none; padding: 10px 24px; cursor: pointer; border-radius: 4px; font-size: 14px; }
        .utc-note { font-size: 12px; color: #e74c3c; margin-bottom: 16px; }
    </style>
</head>
<body>
    <header>
        <h1>空港スポット管理システム</h1>
        <form th:action="@{/logout}" method="post">
            <button type="submit">ログアウト</button>
        </form>
    </header>

    <main>
        <h2>便登録</h2>
		
		<p class="utc-note">※ 時刻はすべてUTCで入力してください（形式：YYYYMMDDHHmm）</p>

		<div th:if="${errorMessage}" style="color:#e74c3c; background:#fadbd8; padding:10px 16px; border-radius:4px; margin-bottom:16px; font-size:13px;" th:text="${errorMessage}"></div>

		<form th:action="@{/spots/flights}" th:object="${flightForm}" method="post">

            <div class="flight-columns">
                <!-- 到着便 -->
                <div class="flight-column">
                    <div class="section-title">到着便情報</div>
                    <div class="form-group">
                        <label>スポット番号<span class="required">*</span></label>
                        <select th:field="*{arrSpotId}">
                            <option value="">選択してください</option>
                            <option th:each="spot : ${spots}"
                                    th:value="${spot.id}"
                                    th:text="${spot.spotNumber}">
                            </option>
                        </select>
                    </div>
                    <div class="form-group">
                        <label>型式<span class="required">*</span></label>
                        <select th:field="*{arrAircraftTypeId}">
                            <option value="">選択してください</option>
                            <option th:each="type : ${aircraftTypes}"
                                    th:value="${type.id}"
                                    th:text="${type.typeName}">
                            </option>
                        </select>
                    </div>
                    <div class="form-group">
                        <label>到着便名<span class="required">*</span></label>
                        <input type="text" th:field="*{arrFlightNumber}">
                    </div>
                    <div class="form-group">
                        <label>出発空港コード<span class="required">*</span></label>
                        <input type="text" th:field="*{arrFromAirport}">
                    </div>
                    <div class="form-group">
                        <label>出発予定時刻（UTC）<span class="required">*</span></label>
                        <input type="text" th:field="*{arrScheduledDepartureTime}">
                    </div>
                    <div class="form-group">
                        <label>目的地空港コード<span class="required">*</span></label>
                        <input type="text" th:field="*{arrToAirport}">
                    </div>
                    <div class="form-group">
                        <label>到着予定時刻（UTC）<span class="required">*</span></label>
                        <input type="text" th:field="*{arrScheduledArrivalTime}">
                    </div>
                    <div class="form-group">
                        <label>出発実績時刻（UTC）<span class="optional">任意</span></label>
                        <input type="text" th:field="*{arrActualDepartureTime}">
                    </div>
                    <div class="form-group">
                        <label>到着実績時刻（UTC）<span class="optional">任意</span></label>
                        <input type="text" th:field="*{arrActualArrivalTime}">
                    </div>
                </div>

                <!-- 出発便 -->
                <div class="flight-column">
                    <div class="section-title">出発便情報</div>
                    <div class="form-group">
                        <label>スポット番号<span class="required">*</span></label>
                        <select th:field="*{depSpotId}">
                            <option value="">選択してください</option>
                            <option th:each="spot : ${spots}"
                                    th:value="${spot.id}"
                                    th:text="${spot.spotNumber}">
                            </option>
                        </select>
                    </div>
                    <div class="form-group">
                        <label>型式<span class="required">*</span></label>
                        <select th:field="*{depAircraftTypeId}">
                            <option value="">選択してください</option>
                            <option th:each="type : ${aircraftTypes}"
                                    th:value="${type.id}"
                                    th:text="${type.typeName}">
                            </option>
                        </select>
                    </div>
                    <div class="form-group">
                        <label>出発便名<span class="required">*</span></label>
                        <input type="text" th:field="*{depFlightNumber}">
                    </div>
                    <div class="form-group">
                        <label>出発空港コード<span class="required">*</span></label>
                        <input type="text" th:field="*{depFromAirport}">
                    </div>
                    <div class="form-group">
                        <label>出発予定時刻（UTC）<span class="required">*</span></label>
                        <input type="text" th:field="*{depScheduledDepartureTime}">
                    </div>
                    <div class="form-group">
                        <label>目的地空港コード<span class="required">*</span></label>
                        <input type="text" th:field="*{depToAirport}">
                    </div>
                    <div class="form-group">
                        <label>到着予定時刻（UTC）<span class="required">*</span></label>
                        <input type="text" th:field="*{depScheduledArrivalTime}">
                    </div>
                    <div class="form-group">
                        <label>出発実績時刻（UTC）<span class="optional">任意</span></label>
                        <input type="text" th:field="*{depActualDepartureTime}">
                    </div>
                    <div class="form-group">
                        <label>到着実績時刻（UTC）<span class="optional">任意</span></label>
                        <input type="text" th:field="*{depActualArrivalTime}">
                    </div>
                </div>
            </div>

            <div class="btn-group">
                <button type="submit" class="btn-primary">登録する</button>
                <button type="button" class="btn-secondary" onclick="location.href='/spots'">キャンセル</button>
            </div>

        </form>
    </main>
</body>
</html>
