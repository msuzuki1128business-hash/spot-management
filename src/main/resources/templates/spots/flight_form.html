<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>便登録 - 空港スポット管理システム</title>

	<link rel="stylesheet"
	      th:href="@{/css/flight-form.css}">
</head>
<body>
    <header>
        <h1>空港スポット管理システム</h1>
        <form th:action="@{/logout}" method="post">
            <button type="submit">ログアウト</button>
        </form>
    </header>

    <main>
        <h2>便登録</h2>
		
		<p class="utc-note">※ 時刻はすべてUTCで入力してください</p>

		<div th:if="${errorMessage}" style="color:#e74c3c; background:#fadbd8; padding:10px 16px; border-radius:4px; margin-bottom:16px; font-size:13px;" th:text="${errorMessage}"></div>

		<form th:action="@{/spots/flights}" th:object="${flightForm}" method="post">

            <div class="flight-columns">
                <!-- 到着便 -->
                <div class="flight-column">
                    <div class="section-title">到着便情報</div>
                    <div class="form-group">
                        <label>スポット番号<span class="required">*</span></label>
                        <select th:field="*{arrSpotId}">
                            <option value="">選択してください</option>
                            <option th:each="spot : ${spots}"
                                    th:value="${spot.id}"
                                    th:text="${spot.spotNumber}">
                            </option>
                        </select>
                    </div>
                    <div class="form-group">
                        <label>型式<span class="required">*</span></label>
                        <select th:field="*{arrAircraftTypeId}">
                            <option value="">選択してください</option>
                            <option th:each="type : ${aircraftTypes}"
                                    th:value="${type.id}"
                                    th:text="${type.typeName}">
                            </option>
                        </select>
                    </div>
                    <div class="form-group">
                        <label>到着便名<span class="required">*</span></label>
                        <input type="text" th:field="*{arrFlightNumber}">
                    </div>
                    <div class="form-group">
                        <label>出発空港<span class="required">*</span></label>
                        <input type="text" th:field="*{arrFromAirport}">
                    </div>
					<div class="form-group">
					    <label>出発予定時刻（UTC）<span class="required">*</span></label>
					    <input type="datetime-local" th:field="*{arrScheduledDepartureTime}">
					</div>
                    <div class="form-group">
                        <label>目的地空港<span class="required">*</span></label>
                        <input type="text" th:field="*{arrToAirport}">
                    </div>
                    <div class="form-group">
                        <label>到着予定時刻（UTC）<span class="required">*</span></label>
                        <input type="datetime-local" th:field="*{arrScheduledArrivalTime}">
                    </div>
                    <div class="form-group">
                        <label>出発実績時刻（UTC）<span class="optional">任意</span></label>
                        <input type="datetime-local" th:field="*{arrActualDepartureTime}">
                    </div>
                    <div class="form-group">
                        <label>到着実績時刻（UTC）<span class="optional">任意</span></label>
                        <input type="datetime-local" th:field="*{arrActualArrivalTime}">
                    </div>
                </div>

                <!-- 出発便 -->
                <div class="flight-column">
                    <div class="section-title">出発便情報</div>
                    <div class="form-group">
                        <label>スポット番号<span class="required">*</span></label>
                        <select th:field="*{depSpotId}">
                            <option value="">選択してください</option>
                            <option th:each="spot : ${spots}"
                                    th:value="${spot.id}"
                                    th:text="${spot.spotNumber}">
                            </option>
                        </select>
                    </div>
                    <div class="form-group">
                        <label>型式<span class="required">*</span></label>
                        <select th:field="*{depAircraftTypeId}">
                            <option value="">選択してください</option>
                            <option th:each="type : ${aircraftTypes}"
                                    th:value="${type.id}"
                                    th:text="${type.typeName}">
                            </option>
                        </select>
                    </div>
                    <div class="form-group">
                        <label>出発便名<span class="required">*</span></label>
                        <input type="text" th:field="*{depFlightNumber}">
                    </div>
                    <div class="form-group">
                        <label>出発空港<span class="required">*</span></label>
                        <input type="text" th:field="*{depFromAirport}">
                    </div>
                    <div class="form-group">
                        <label>出発予定時刻（UTC）<span class="required">*</span></label>
                        <input type="datetime-local" th:field="*{depScheduledDepartureTime}">
                    </div>
                    <div class="form-group">
                        <label>目的地空港<span class="required">*</span></label>
                        <input type="text" th:field="*{depToAirport}">
                    </div>
                    <div class="form-group">
                        <label>到着予定時刻（UTC）<span class="required">*</span></label>
                        <input type="datetime-local" th:field="*{depScheduledArrivalTime}">
                    </div>
                    <div class="form-group">
                        <label>出発実績時刻（UTC）<span class="optional">任意</span></label>
                        <input type="datetime-local" th:field="*{depActualDepartureTime}">
                    </div>
                    <div class="form-group">
                        <label>到着実績時刻（UTC）<span class="optional">任意</span></label>
                        <input type="datetime-local" th:field="*{depActualArrivalTime}">
                    </div>
                </div>
            </div>

            <div class="btn-group">
                <button type="submit" class="btn-primary">登録</button>
                <button type="button" class="btn-secondary" onclick="location.href='/spots'">キャンセル</button>
            </div>

        </form>
    </main>
</body>
</html>
